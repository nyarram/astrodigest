services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: on-failure:3
    env_file: .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - redis
    expose:
      - "3000"

  workers:
    build:
      context: .
      dockerfile: packages/workers/Dockerfile
    restart: on-failure:3
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis

  digest-assembly:
    build:
      context: .
      dockerfile: packages/digest-assembly/Dockerfile
    profiles: ["cron"] # not started by `docker compose up` — invoked on-demand by crontab
    restart: "no"
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
  redis_data:
